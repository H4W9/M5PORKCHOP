; Author: 0ct0
; Pancake / DualBoot target added by H4W9

; ---- Original Cardputer target (unchanged) -----------------
[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
custom_version = 0.1.8b-PSTH
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    -DARDUINO_M5Stack_StampS3
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    -Wl,-zmuldefs
    -Os

lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

; ---- Cardputer debug target (unchanged) --------------------
[env:m5cardputer-debug]
extends = env:m5cardputer
build_type = debug
build_flags =
    ${env:m5cardputer.build_flags}
    -DPORKCHOP_LOG_ENABLED=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; ---- Pancake DualBoot target --------------------------------
; ESP32-C5-DevKitC-1 + ST7796 3.5" + FT6336 capacitive touch
;
; DualBoot layout (shared with Marauder DualBoot):
;   ota_0 @ 0x10000  = Marauder  (boots by default)
;   ota_1 @ 0x310000 = Porkchop  (this build)
;
; Flash procedure:
;   1. Flash Marauder DualBoot to ota_0 using its own build
;   2. Flash THIS firmware to ota_1:
;        esptool.py --port COMx write_flash 0x310000 .pio/build/pancake/firmware.bin
;   3. Marauder DualBoot menu switches between slots via
;      esp_ota_set_boot_partition() — no extra config needed here.
[env:pancake]
platform = espressif32@6.12.0
board = esp32-c5-devkitc-1
framework = arduino
custom_version = 0.1.8b-PSTH-PANCAKE
board_build.mcu = esp32c5
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
; MUST match Marauder DualBoot partition table exactly
board_build.partitions = partitions_pancake.csv
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    ; Pancake + DualBoot identifiers
    -DPORKCHOP_PANCAKE=1
    -DMARAUDER_PANCAKE=1
    -DPORKCHOP_DUALBOOT=1
    -DPORKCHOP_BOOT_SLOT=1
    ; Force-include HAL shim before every TU — intercepts M5Cardputer/M5Unified
    -include src/pancake/pancake_hal.h
    -include src/core/logging.h
    ; TFT_eSPI: pull User_Setup.h from project root
    -DUSER_SETUP_LOADED=1
    -include User_Setup.h
    ; NimBLE internal RAM (no PSRAM on DevKit)
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; Raw frame sanity check override (same as upstream)
    -Wl,-zmuldefs
    -Os
    ; Include paths for pancake HAL
    -I src
    -I src/pancake

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

; ---- Pancake debug target ----------------------------------
[env:pancake-debug]
extends = env:pancake
build_type = debug
build_flags =
    ${env:pancake.build_flags}
    -DPORKCHOP_LOG_ENABLED=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; ---- Native unit tests (unchanged) -------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
test_build_src = false

[env:native_coverage]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
    -O0
    -g
    -fprofile-arcs
    -ftest-coverage
    -lgcov
    --coverage
build_unflags =
    -O2
    -O3
test_build_src = false

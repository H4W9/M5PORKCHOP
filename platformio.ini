; Author: 0ct0
; Pancake / DualBoot target added by H4W9

; ---- Original Cardputer target (unchanged) -----------------
[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
custom_version = 0.1.8b-PSTH
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.sdkconfig = sdkconfig.defaults
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DPORKCHOP_LOG_ENABLED=0
    -include src/core/logging.h
    -DARDUINO_M5Stack_StampS3
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=0
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    -Wl,-zmuldefs
    -Os

lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

; ---- Cardputer debug target (unchanged) --------------------
[env:m5cardputer-debug]
extends = env:m5cardputer
build_type = debug
build_flags =
    ${env:m5cardputer.build_flags}
    -DPORKCHOP_LOG_ENABLED=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; ---- Pancake DualBoot target --------------------------------
; ESP32-C5-DevKitC-1 + ST7796 3.5" + FT6336 capacitive touch
;
; DualBoot layout (matches your partitions_pancake.csv):
;   ota_0 @ 0x20000  = Porkchop (this build, boots by default)
;   ota_1 @ 0x390000 = Marauder
;
; Flash procedure:
;   1. Normal pio upload flashes Porkchop to ota_0
;   2. Flash Marauder DualBoot binary to ota_1:
;        esptool.py --port COMx write_flash 0x390000 marauder_pancake.bin
;   3. SYSTEM > BOOT OTA_1 in Porkchop switches to Marauder.
;      Marauder DualBoot menu switches back to Porkchop.
;
; NOTE: Official espressif32 platform does NOT support ESP32-C5.
; pioarduino fork is required — it tracks arduino-esp32 core 3.x
; with full C5 support. The 'stable' zip always resolves to latest.
[env:pancake]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
custom_version = 0.1.8b-PSTH-PANCAKE
board_build.mcu = esp32c5
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
; MUST match Marauder DualBoot partition table exactly
board_build.partitions = partitions_pancake.csv
; custom_sdkconfig triggers pioarduino to recompile IDF libs with these settings,
; producing a sdkconfig.h that includes CONFIG_SPIRAM=y. This is the correct way
; to enable PSRAM for ESP32-C5 with pioarduino — board_build.arduino.memory_type
; and board_build.sdkconfig do not work for this chip/platform combination.
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_OCT=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -DPORKCHOP_LOG_ENABLED=0
    ; Pancake + DualBoot identifiers
    -DPORKCHOP_PANCAKE=1
    -DMARAUDER_PANCAKE=1
    -DPORKCHOP_DUALBOOT=1
    -DPORKCHOP_BOOT_SLOT=1
    ; Force-include the lightweight guard-only HAL shim.
    ; This blocks M5Cardputer.h/M5Unified.h everywhere but does NOT
    ; include TFT_eSPI.h (which would break library TU compilation).
    ; Full HAL types come via display.h -> pancake_hal_impl.h.
    -include src/pancake/pancake_hal.h
    -include src/core/logging.h
    ; and use whatever was set in User_Setup_Select.h in lib/TFT_eSPI/
    ; NimBLE: use PSRAM for BLE stack (PSRAM now enabled)
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=1
    -DCONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=0
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; Raw frame sanity check override (same as upstream)
    -Wl,-zmuldefs
    -Os
    ; Include paths — stubs/ MUST be first so it shadows real M5 headers
    -I src/pancake/stubs
    -I src
    -I src/pancake
    ; TFT_eSPI local lib — explicit path so it's findable from all TUs
    -I lib/TFT_eSPI/TFT_eSPI-ESP32-C5
    -I lib/TFT_eSPI/User_Setups

lib_extra_dirs =
    lib/TFT_eSPI

lib_deps =
    ; TFT_eSPI: use local lib/TFT_eSPI/TFT_eSPI-ESP32-C5 via lib_extra_dirs
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

; ---- Pancake debug target ----------------------------------
[env:pancake-debug]
extends = env:pancake
build_type = debug
build_flags =
    ${env:pancake.build_flags}
    -DPORKCHOP_LOG_ENABLED=1
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; ---- Native unit tests (unchanged) -------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
test_build_src = false

[env:native_coverage]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
    -O0
    -g
    -fprofile-arcs
    -ftest-coverage
    -lgcov
    --coverage
build_unflags =
    -O2
    -O3
test_build_src = false

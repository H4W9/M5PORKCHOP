; Author: 0ct0
; Pancake / DualBoot target added by H4W9

; ---- Pancake DualBoot target --------------------------------
; ESP32-C5-DevKitC-1 + ST7796 3.5" + FT6336 capacitive touch
;
; DualBoot layout (matches your partitions_pancake.csv):
;   ota_0 @ 0x20000  = Porkchop (this build, boots by default)
;   ota_1 @ 0x390000 = Marauder
;
; Flash procedure:
;   1. Normal pio upload flashes Porkchop to ota_0
;   2. Flash Marauder DualBoot binary to ota_1:
;        esptool.py --port COMx write_flash 0x390000 marauder_pancake.bin
;   3. SYSTEM > BOOT OTA_1 in Porkchop switches to Marauder.
;      Marauder DualBoot menu switches back to Porkchop.
;
; ESP32-C5 requires the pioarduino fork. Pinned to 55.03.311
; (arduino-esp32 3.3.11 / ESP-IDF 5.5.5) — not 'stable', which drifts.
[env:pancake]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
custom_version = 0.2.2-PSTH-PANCAKE
board_build.mcu = esp32c5
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; MUST match Marauder DualBoot partition table exactly
board_build.partitions = partitions_pancake.csv
custom_sdkconfig =
    ; PSRAM enabled (QUAD/40MHz, matching the working ESP32_Bible/JANOS refs).
    ; Big display sprites and allocations live in PSRAM; internal RAM stays free.
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_QUAD=y
    CONFIG_SPIRAM_SPEED_40M=y
    CONFIG_SPIRAM_BOOT_INIT=y
    CONFIG_SPIRAM_USE_MALLOC=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=16384
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_INTERNAL=n
    CONFIG_BT_NIMBLE_LOG_LEVEL=1
    ; Mirror IDF console + panic backtrace to USB-Serial-JTAG.
    CONFIG_ESP_CONSOLE_SECONDARY_USB_SERIAL_JTAG=y
    CONFIG_ESP_SYSTEM_PANIC_PRINT_HALT=y
    CONFIG_ESP_PANIC_HANDLER_IRAM=y
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -DPORKCHOP_LOG_ENABLED=0
    ; Pancake + DualBoot identifiers
    -DPORKCHOP_PANCAKE=1
    -DMARAUDER_PANCAKE=1
    -DPORKCHOP_DUALBOOT=1
    -DPORKCHOP_BOOT_SLOT=1
    ; Force-include the lightweight guard-only HAL shim.
    ; This blocks M5Cardputer.h/M5Unified.h everywhere but does NOT
    ; include TFT_eSPI.h (which would break library TU compilation).
    ; Full HAL types come via display.h -> pancake_hal_impl.h.
    -include src/pancake/pancake_hal.h
    -include src/core/logging.h
    ; Raw frame sanity check override (same as upstream)
    -Wl,-zmuldefs
    -Os
    ; Include paths — stubs/ MUST be first so it shadows real M5 headers
    -I src/pancake/stubs
    -I src
    -I src/pancake
    ; TFT_eSPI local lib — explicit path so it's findable from all TUs
    -I lib/TFT_eSPI/TFT_eSPI-ESP32-C5
    -I lib/TFT_eSPI/User_Setups

lib_extra_dirs =
    lib/TFT_eSPI

lib_deps =
    ; TFT_eSPI: use local lib/TFT_eSPI/TFT_eSPI-ESP32-C5 via lib_extra_dirs
    bblanchon/ArduinoJson@^7.4.2
    mikalhart/TinyGPSPlus@^1.0.3
    h2zero/NimBLE-Arduino@^2.3.7

extra_scripts = pre:scripts/pre_build.py

; ---- Marauder V8 DualBoot target ---------------------------
; ESP32-C5 + ILI9341 240x320 + XPT2046 resistive touch.
; Reuses the C5 HAL/infrastructure (defines PORKCHOP_PANCAKE) and layers the
; V8 hardware differences on top (defines PORKCHOP_MARAUDER_V8): ILI9341 driver,
; 240x320 geometry, XPT2046 touch, and the V8 pin map. Pins/driver come from
; User_Setup_marauder_V8.h (selected by the PORKCHOP_MARAUDER_V8 flag).
[env:marauder_v8]
extends = env:pancake
board_build.partitions = partitions_marauder_v8.csv
custom_version = 0.2.2-PSTH-V8
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -DPORKCHOP_LOG_ENABLED=0
    ; Reuse the shared ESP32-C5 HAL, then override with V8 specifics.
    -DPORKCHOP_PANCAKE=1
    -DPORKCHOP_MARAUDER_V8=1
    -DMARAUDER_V8=1
    -DPORKCHOP_DUALBOOT=1
    -DPORKCHOP_BOOT_SLOT=1
    -include src/pancake/pancake_hal.h
    -include src/core/logging.h
    -Wl,-zmuldefs
    -Os
    -I src/pancake/stubs
    -I src
    -I src/pancake
    -I lib/TFT_eSPI/TFT_eSPI-ESP32-C5
    -I lib/TFT_eSPI/User_Setups

; ---- Pancake debug target ----------------------------------
[env:pancake-debug]
extends = env:pancake
build_type = debug
build_flags =
    ${env:pancake.build_flags}
    -DPORKCHOP_LOG_ENABLED=0
    -DDEBUG_MODE=1
    -DCORE_DEBUG_LEVEL=4

; ---- Native unit tests (unchanged) -------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
test_build_src = false

[env:native_coverage]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_INCLUDE_FLOAT
    -O0
    -g
    -fprofile-arcs
    -ftest-coverage
    -lgcov
    --coverage
build_unflags =
    -O2
    -O3
test_build_src = false

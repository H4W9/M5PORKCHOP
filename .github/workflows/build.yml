name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create/refresh a GitHub release with the firmware'
        type: boolean
        default: false
  push:
    branches: [ main, develop, personality_disorder_innit, Pancake-Porkchop ]
    tags: [ 'v*' ]          # a v* tag push also cuts a release
  pull_request:
    branches: [ main ]

permissions:
  contents: write           # needed by the (optional) release job

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-pancake-55311-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-pancake-55311-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (pancake)
        run: |
          pio run -e pancake

      - name: Rename firmware -> porkchop_pancake.bin
        run: |
          cp .pio/build/pancake/firmware.bin .pio/build/pancake/porkchop_pancake.bin
          ls -l .pio/build/pancake/porkchop_pancake.bin

      - name: Dump EFFECTIVE sdkconfig (verify custom_sdkconfig actually applied)
        if: always()
        run: |
          echo "=== generated sdkconfig files ==="
          find .pio -name 'sdkconfig' -o -name 'sdkconfig.h' 2>/dev/null
          F=$(find .pio -path '*pancake*' -name 'sdkconfig' 2>/dev/null | head -1)
          echo "### using: $F"
          if [ -n "$F" ]; then
            echo "--- SPIRAM ---";  grep -iE 'CONFIG_SPIRAM' "$F" || echo "(no SPIRAM lines)"
            echo "--- CONSOLE ---"; grep -iE 'CONFIG_ESP_CONSOLE' "$F" || true
          fi

      - name: Generate symbol table (for crash-PC symbolization)
        if: always()
        run: |
          ELF=.pio/build/pancake/firmware.elf
          NM=$(find ~/.platformio/packages -name 'riscv32-esp-elf-nm' 2>/dev/null | head -1)
          A2L=$(find ~/.platformio/packages -name 'riscv32-esp-elf-addr2line' 2>/dev/null | head -1)
          echo "nm=$NM addr2line=$A2L elf=$ELF"
          if [ -n "$NM" ] && [ -f "$ELF" ]; then
            "$NM" -nSC "$ELF" > .pio/build/pancake/firmware.sym.txt || true
            echo "symbols: $(wc -l < .pio/build/pancake/firmware.sym.txt) lines"
          fi

      - name: Upload firmware artifact (pancake)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pancake
          path: |
            .pio/build/pancake/porkchop_pancake.bin
            .pio/build/pancake/firmware.bin
            .pio/build/pancake/firmware.elf
            .pio/build/pancake/firmware.map
            .pio/build/pancake/firmware.sym.txt
          retention-days: 30

      # ── Marauder V8 (in-progress port) ────────────────────────────────────
      # Non-blocking: the overlay keyboard UI (stage 4) isn't done, so this may
      # still fail or boot with an unusable keyboard. It exists so the V8 target
      # is exercised by CI and a binary is available to validate display + touch.
      - name: Build firmware (marauder_v8)
        id: build_v8
        continue-on-error: true
        run: |
          pio run -e marauder_v8

      - name: Rename firmware -> porkchop_v8.bin
        if: steps.build_v8.outcome == 'success'
        run: |
          cp .pio/build/marauder_v8/firmware.bin .pio/build/marauder_v8/porkchop_v8.bin
          ls -l .pio/build/marauder_v8/porkchop_v8.bin

      - name: Upload firmware artifact (marauder_v8)
        if: steps.build_v8.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-marauder_v8
          path: |
            .pio/build/marauder_v8/porkchop_v8.bin
            .pio/build/marauder_v8/firmware.bin
            .pio/build/marauder_v8/firmware.elf
            .pio/build/marauder_v8/firmware.map
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════════
  # Optional release — on a v* tag push, or a manual run with release=true.
  # Attaches porkchop_pancake.bin (+ the ELF for crash symbolization).
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware artifact (pancake)
        uses: actions/download-artifact@v4
        with:
          name: firmware-pancake
          path: dl

      - name: Download firmware artifact (marauder_v8)
        uses: actions/download-artifact@v4
        continue-on-error: true   # V8 build is non-blocking; may not exist
        with:
          name: firmware-marauder_v8
          path: dl_v8

      - name: Create / refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VER=$(sed -n 's/^[[:space:]]*custom_version[[:space:]]*=[[:space:]]*//p' platformio.ini | head -1)
            TAG="v${VER}"
          fi
          echo "Releasing tag: $TAG"
          # Refresh the release, then upload assets in a SEPARATE step. Uploading
          # assets inline with `gh release create` can 404 (the release isn't fully
          # propagated when the asset upload fires); a distinct `gh release upload
          # --clobber` is reliable and also overwrites any stale assets.
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Automated build of Porkchop Pancake + Marauder V8 $TAG." \
            --target "${{ github.sha }}"
          # Attach Pancake always; V8 bin + elf only if that build produced them.
          # if/then avoids `[ -f ] &&` tripping `set -e` when the file is absent.
          gh release upload "$TAG" dl/porkchop_pancake.bin dl/firmware.elf --clobber
          if [ -f dl_v8/porkchop_v8.bin ]; then gh release upload "$TAG" dl_v8/porkchop_v8.bin --clobber; fi
          if [ -f dl_v8/firmware.elf ];    then gh release upload "$TAG" "dl_v8/firmware.elf#porkchop_v8.elf" --clobber; fi

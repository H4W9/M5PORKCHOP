name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, personality_disorder_innit ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-pancake-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-pancake-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (pancake)
        run: |
          pio run -e pancake

      - name: Upload firmware artifact (pancake)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pancake
          path: .pio/build/pancake/firmware.bin
          retention-days: 30

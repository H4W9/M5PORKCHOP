name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, personality_disorder_innit, Pancake-Porkchop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-pancake-55311-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-pancake-55311-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (pancake)
        run: |
          pio run -e pancake

      - name: Dump EFFECTIVE sdkconfig (verify custom_sdkconfig actually applied)
        if: always()
        run: |
          echo "=== generated sdkconfig files ==="
          find .pio -name 'sdkconfig' -o -name 'sdkconfig.h' 2>/dev/null
          F=$(find .pio -path '*pancake*' -name 'sdkconfig' 2>/dev/null | head -1)
          echo "### using: $F"
          if [ -n "$F" ]; then
            echo "--- SPIRAM ---";  grep -iE 'CONFIG_SPIRAM' "$F" || echo "(no SPIRAM lines)"
            echo "--- CONSOLE ---"; grep -iE 'CONFIG_ESP_CONSOLE' "$F" || true
          fi

      - name: Generate symbol table (for crash-PC symbolization)
        if: always()
        run: |
          ELF=.pio/build/pancake/firmware.elf
          NM=$(find ~/.platformio/packages -name 'riscv32-esp-elf-nm' 2>/dev/null | head -1)
          A2L=$(find ~/.platformio/packages -name 'riscv32-esp-elf-addr2line' 2>/dev/null | head -1)
          echo "nm=$NM addr2line=$A2L elf=$ELF"
          if [ -n "$NM" ] && [ -f "$ELF" ]; then
            "$NM" -nSC "$ELF" > .pio/build/pancake/firmware.sym.txt || true
            echo "symbols: $(wc -l < .pio/build/pancake/firmware.sym.txt) lines"
          fi

      - name: Upload firmware artifact (pancake)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pancake
          path: |
            .pio/build/pancake/firmware.bin
            .pio/build/pancake/firmware.elf
            .pio/build/pancake/firmware.map
            .pio/build/pancake/firmware.sym.txt
          retention-days: 30

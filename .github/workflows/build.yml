name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, personality_disorder_innit ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - env: m5cardputer
            artifact: firmware-cardputer
            bin: .pio/build/m5cardputer/firmware.bin
          - env: pancake
            artifact: firmware-pancake
            bin: .pio/build/pancake/firmware.bin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware (${{ matrix.env }})
        run: |
          pio run -e ${{ matrix.env }}

      - name: Upload firmware artifact (${{ matrix.env }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          retention-days: 30
